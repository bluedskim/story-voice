<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2240" />
    <title>잠자리 이야기</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="star star-a"></span>
      <span class="star star-b"></span>
      <span class="star star-c"></span>
      <span class="moon"></span>
    </div>

    <div class="app">
      <header class="header">
        <div class="header-top">
          <div>
            <p class="eyebrow">story-voice</p>
            <h1>잠자리 이야기</h1>
            <p class="subtitle">엄마·아빠 목소리로 듣는 동화</p>
          </div>
          <nav class="auth-bar" id="auth-bar" aria-label="계정">
            <span id="auth-user-label" class="auth-user" hidden></span>
            <button type="button" id="auth-login-btn" class="btn btn-secondary btn-sm">로그인</button>
            <button type="button" id="auth-signup-btn" class="btn btn-secondary btn-sm">회원가입</button>
            <button type="button" id="auth-logout-btn" class="btn btn-secondary btn-sm" hidden>로그아웃</button>
          </nav>
        </div>
      </header>

      <nav class="tabs" aria-label="메뉴">
        <button type="button" class="tab is-active" data-tab="stories" aria-selected="true">이야기</button>
        <button type="button" class="tab" data-tab="voice" aria-selected="false">목소리</button>
      </nav>

      <div id="gen-status" class="gen-status" hidden role="status">
        <p class="gen-status-text" id="gen-status-text"></p>
        <div class="gen-progress" id="gen-progress" hidden>
          <div class="gen-progress-bar" id="gen-progress-bar"></div>
        </div>
      </div>

      <section id="panel-stories" class="panel">
        <div class="panel-actions">
          <button type="button" id="regen-all" class="btn btn-secondary">
            <span class="btn-icon" aria-hidden="true">✨</span>
            전체 다시 만들기
          </button>
        </div>
        <main id="story-list" class="story-list" aria-live="polite"></main>
      </section>

      <section id="panel-voice" class="panel" hidden>
        <p id="voice-auth-gate" class="auth-gate card" hidden>
          로그인하면 목소리를 저장할 수 있어요. 가족 관리자만 저장·이야기 만들기를 할 수 있습니다.
        </p>
        <ol class="voice-steps" aria-label="목소리 저장 단계">
          <li class="voice-step is-active" data-step="1">
            <span class="voice-step-num">1</span>
            <span>녹음</span>
          </li>
          <li class="voice-step" data-step="2">
            <span class="voice-step-num">2</span>
            <span>받아쓰기</span>
          </li>
          <li class="voice-step" data-step="3">
            <span class="voice-step-num">3</span>
            <span>저장</span>
          </li>
        </ol>

        <div class="card voice-card">
          <p class="voice-hint">
            대본을 읽어 녹음하거나 파일을 올려 주세요. 받아쓰기가 녹음과 같아야 이야기 길이가 정상이에요.
          </p>
          <label class="field-label" for="record-script">녹음 대본</label>
          <textarea id="record-script" class="transcript transcript-readonly" rows="5" readonly spellcheck="false"></textarea>

          <div class="voice-controls">
            <button type="button" id="record-btn" class="btn btn-primary">
              <span class="btn-icon" aria-hidden="true">🎙</span>
              녹음
            </button>
            <button type="button" id="stop-btn" class="btn btn-secondary" disabled>멈춤</button>
            <label class="btn btn-secondary file-label">
              파일 올리기
              <input type="file" id="file-input" accept="audio/*,.m4a,.mp4,.wav,.webm" hidden />
            </label>
          </div>

          <div class="preview-player">
            <audio id="preview" class="preview-audio" playsinline></audio>
            <p class="preview-label">미리 듣기</p>
            <div class="mini-player" id="preview-player-ui" hidden>
              <button type="button" class="mini-play" id="preview-play" aria-label="미리 듣기 재생">▶</button>
              <span class="mini-time" id="preview-time">0:00</span>
            </div>
          </div>

          <button type="button" id="prepare-voice" class="btn btn-secondary btn-wide" disabled>받아쓰기 확인</button>
        </div>

        <div id="voice-review" class="card voice-review" hidden>
          <p id="voice-meta" class="voice-meta"></p>
          <div id="voice-match" class="voice-match" aria-live="polite">
            <span class="match-ring" id="match-ring"></span>
            <span class="match-text" id="match-text"></span>
          </div>
          <label class="field-label" for="transcript">받아쓰기 (수정 가능)</label>
          <textarea id="transcript" class="transcript" rows="6" spellcheck="false"></textarea>
          <button type="button" id="save-voice" class="btn btn-primary btn-wide">이 목소리로 저장</button>
        </div>

        <p id="voice-msg" class="voice-msg" role="status"></p>
      </section>

      <footer class="footer">
        <p>조용히 듣고, 편안히 쉬어요.</p>
      </footer>
    </div>

    <aside id="now-playing" class="now-playing" hidden aria-label="재생 중">
      <div class="np-art" id="np-art" aria-hidden="true">📖</div>
      <div class="np-body">
        <p class="np-title" id="np-title">—</p>
        <div class="np-times">
          <span id="np-current">0:00</span>
          <span class="np-sep">/</span>
          <span id="np-duration">0:00</span>
        </div>
        <input
          type="range"
          id="np-seek"
          class="np-seek"
          min="0"
          max="1000"
          value="0"
          aria-label="재생 위치"
        />
      </div>
      <button type="button" id="np-play" class="np-play" aria-label="일시정지">⏸</button>
    </aside>

    <dialog id="modal-login" class="auth-modal" hidden>
      <form id="login-form" class="auth-form card">
        <h2 class="auth-title">로그인</h2>
        <label class="field-label" for="login-email">이메일</label>
        <input id="login-email" class="field-input" type="email" autocomplete="email" required />
        <label class="field-label" for="login-password">비밀번호</label>
        <input id="login-password" class="field-input" type="password" autocomplete="current-password" required />
        <p id="login-error" class="auth-msg error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-wide">로그인</button>
        <button type="button" id="login-to-signup" class="btn btn-secondary btn-wide">회원가입</button>
        <button type="button" class="btn btn-secondary btn-wide" data-close-modal>닫기</button>
      </form>
    </dialog>

    <dialog id="modal-signup" class="auth-modal" hidden>
      <form id="signup-form" class="auth-form card">
        <h2 class="auth-title">회원가입</h2>
        <label class="field-label" for="signup-email">이메일</label>
        <input id="signup-email" class="field-input" type="email" autocomplete="email" required />
        <label class="field-label" for="signup-nickname">닉네임</label>
        <input id="signup-nickname" class="field-input" type="text" maxlength="12" required />
        <p id="signup-nickname-status" class="auth-nick" aria-live="polite"></p>
        <button type="button" id="signup-send-code" class="btn btn-secondary btn-wide">인증코드 보내기</button>
        <p id="signup-dev-hint" class="auth-msg" hidden></p>
        <div id="signup-code-wrap" hidden>
          <label class="field-label" for="signup-code">인증코드 (6자리)</label>
          <input id="signup-code" class="field-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" />
        </div>
        <label class="field-label" for="signup-password">비밀번호</label>
        <input id="signup-password" class="field-input" type="password" autocomplete="new-password" minlength="8" required />
        <label class="field-label" for="signup-password2">비밀번호 확인</label>
        <input id="signup-password2" class="field-input" type="password" autocomplete="new-password" minlength="8" required />
        <p id="signup-error" class="auth-msg error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-wide">가입하기</button>
        <button type="button" id="signup-to-login" class="btn btn-secondary btn-wide">로그인으로</button>
        <button type="button" class="btn btn-secondary btn-wide" data-close-modal>닫기</button>
      </form>
    </dialog>

    <audio id="player" preload="metadata"></audio>
    <script src="app.js" type="module"></script>
  </body>
</html>
