<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <title>잠자리 이야기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <p class="eyebrow">story-voice</p>
        <h1>잠자리 이야기</h1>
        <p class="subtitle">엄마·아빠 목소리로 듣는 동화</p>
      </header>

      <nav class="tabs" aria-label="메뉴">
        <button type="button" class="tab is-active" data-tab="stories">이야기</button>
        <button type="button" class="tab" data-tab="voice">목소리</button>
      </nav>

      <p id="gen-status" class="gen-status" hidden></p>

      <section id="panel-stories" class="panel">
        <div class="panel-actions">
          <button type="button" id="regen-all" class="btn-secondary">전체 다시 만들기</button>
        </div>
        <main id="story-list" class="story-list" aria-live="polite"></main>
      </section>

      <section id="panel-voice" class="panel" hidden>
        <p class="voice-hint">
          1단계: 아래 대본을 읽어 녹음하거나 파일을 올려 주세요. 2단계: 자동 받아쓰기를 확인한 뒤 저장합니다.
          녹음과 받아쓰기가 같아야 이야기 길이가 정상이에요.
        </p>
        <label class="field-label" for="record-script">녹음 대본</label>
        <textarea id="record-script" class="transcript transcript-readonly" rows="6" readonly spellcheck="false"></textarea>

        <div class="voice-controls">
          <button type="button" id="record-btn" class="btn-primary">녹음</button>
          <button type="button" id="stop-btn" class="btn-secondary" disabled>멈춤</button>
          <label class="btn-secondary file-label">
            파일 올리기
            <input type="file" id="file-input" accept="audio/*,.m4a,.mp4,.wav,.webm" hidden />
          </label>
        </div>

        <audio id="preview" class="preview-audio" controls playsinline></audio>

        <button type="button" id="prepare-voice" class="btn-secondary btn-wide" disabled>받아쓰기 확인</button>

        <div id="voice-review" class="voice-review" hidden>
          <p id="voice-meta" class="voice-meta"></p>
          <p id="voice-match" class="voice-match" aria-live="polite"></p>
          <label class="field-label" for="transcript">받아쓰기 (수정 가능)</label>
          <textarea id="transcript" class="transcript" rows="6" spellcheck="false"></textarea>
          <button type="button" id="save-voice" class="btn-primary btn-wide">이 목소리로 저장</button>
        </div>

        <p id="voice-msg" class="voice-msg"></p>
      </section>

      <footer class="footer">
        <p>조용히 듣고, 편안히 쉬어요.</p>
      </footer>
    </div>

    <audio id="player" preload="metadata"></audio>
    <script src="app.js" type="module"></script>
  </body>
</html>
